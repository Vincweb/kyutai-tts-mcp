[project]
name = "kyutai-tts-mcp"
version = "0.7.0"
description = "MCP server wrapping Kyutai Pocket TTS for Claude Code (in-process, streaming, gap-free playback, multi-language)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vincent Caudron" }]
requires-python = ">=3.10,<3.14"
keywords = ["mcp", "tts", "kyutai", "claude", "claude-code", "voice", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.0.0",
  "pocket-tts>=3.3",
  "numpy>=1.26",
  "sounddevice>=0.5",
]

[project.urls]
Homepage = "https://github.com/Vincweb/kyutai-tts-mcp"
Repository = "https://github.com/Vincweb/kyutai-tts-mcp"
Issues = "https://github.com/Vincweb/kyutai-tts-mcp/issues"

[project.scripts]
kyutai-tts-mcp = "kyutai_tts_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyutai_tts_mcp"]
